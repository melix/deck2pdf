itextpdf = "5.5.13.4"

extra-modules-plugin = "1.9"
nexus-plugin = "2.0.0"
javafx-plugin = "0.1.0"

[libraries]
groovy-core = { module = "org.apache.groovy:groovy", version.ref = "groovy" }
